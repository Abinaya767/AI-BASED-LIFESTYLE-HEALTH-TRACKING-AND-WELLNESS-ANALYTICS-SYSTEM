<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | HealthAnalytics</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#f5f8ff;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}

.login-box{

width:430px;

background:white;

padding:45px;

border-radius:22px;

box-shadow:0 15px 35px rgba(0,0,0,.12);

text-align:center;

}

.logo{

width:80px;
height:80px;

margin:auto;

border-radius:50%;

background:#e7fff5;

display:flex;

justify-content:center;

align-items:center;

margin-bottom:20px;

}

.logo i{

font-size:38px;

color:#1dbf73;

}

h1{

color:#0f4c81;

margin-bottom:8px;

}

.subtitle{

color:#666;

font-size:15px;

margin-bottom:30px;

line-height:25px;

}

.input-box{

display:flex;

align-items:center;

border:1px solid #ddd;

border-radius:10px;

padding:0 15px;

margin-bottom:20px;

transition:.3s;

}

.input-box:focus-within{

border-color:#1dbf73;

box-shadow:0 0 8px rgba(29,191,115,.2);

}

.input-box i{

color:#1dbf73;

font-size:18px;

margin-right:12px;

}

.input-box input,
.input-box select{

width:100%;

border:none;

outline:none;

padding:15px 0;

font-size:15px;

background:transparent;

}

button{

width:100%;

padding:16px;

background:#1dbf73;

color:white;

border:none;

border-radius:12px;

font-size:17px;

font-weight:600;

cursor:pointer;

transition:.3s;

margin-top:10px;

}

button:hover{

background:#159b5d;

}

.footer{

margin-top:25px;

font-size:13px;

color:#777;

line-height:22px;

}

@media(max-width:500px){

.login-box{

width:90%;

padding:30px;

}

}

</style>

</head>

<body>

<div class="login-box">

<div class="logo">

<i class="fa-solid fa-heart-pulse"></i>

</div>

<h1>

HealthAnalytics

</h1>

<p class="subtitle">

Welcome! Enter your basic details to begin your personalized lifestyle health assessment.

</p>

<form action="/age_category" method="GET">

<div class="input-box">

<i class="fa-solid fa-user"></i>

<input
type="text"
name="name"
placeholder="Enter Full Name"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-envelope"></i>

<input
type="email"
name="email"
placeholder="Enter Email Address"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-phone"></i>

<input
type="tel"
name="phone"
placeholder="Enter Mobile Number"
required>

</div>

<div class="input-box">

<i class="fa-solid fa-venus-mars"></i>

<select name="gender" required>

<option value="">Select Gender</option>

<option value="Male">Male</option>

<option value="Female">Female</option>

<option value="Other">Other</option>

</select>

</div>

<button type="submit">

<i class="fa-solid fa-arrow-right"></i>

Continue

</button>

</form>

<div class="footer">

Your information is used only to generate your personalized health assessment report.<br>

Your data remains private and secure.

</div>

</div>

</body>

</html>
